name: Neon preview branch

# One ephemeral Neon branch per pull request, created from `production` and
# deleted when the PR closes. Migrations run against the branch, so a PR that
# breaks a migration fails here rather than on merge.
#
# This branch is a test fixture: its connection string never leaves the runner,
# and no deployment ever reads it. The deployed Vercel preview gets its own
# `preview/<git-branch>` from the Neon-managed Vercel integration. Do not wire
# this branch into Vercel — see docs/database-workflow.md.
#
# Requires (see docs/database-workflow.md):
#   secret   NEON_API_KEY
#   variable NEON_PROJECT_ID
#
# Both jobs are gated on NEON_PROJECT_ID, so until it is set they skip rather
# than run. That keeps the workflow from touching a database before it is
# configured, without failing every pull request in the meantime — a check
# that is permanently red is a check people stop reading.
#
# (The gate is on the variable, not the secret: `secrets` is not available in a
# job-level `if`, but `vars` is. Setting one without the other still fails, in
# the step that needs the missing value.)

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

concurrency:
  group: neon-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  create:
    if: vars.NEON_PROJECT_ID != '' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Create Neon branch for this PR
        uses: neondatabase/create-branch-action@v5
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch_name: preview/pr-${{ github.event.pull_request.number }}
          parent: production
          api_key: ${{ secrets.NEON_API_KEY }}

      # This fixture never serves a deployment. Refresh it on every run so
      # previous migrations/imports cannot mask failures or retain stale content.
      - name: Reset CI branch to production
        id: branch
        uses: neondatabase/reset-branch-action@v1
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch: preview/pr-${{ github.event.pull_request.number }}
          parent: true
          api_key: ${{ secrets.NEON_API_KEY }}

      - run: npm ci

      # Order matters: the drizzle migration creates the `payload` schema that
      # Payload's own migration then populates. See docs/database-workflow.md.
      - name: Run drizzle migrations
        env:
          DATABASE_URL: ${{ steps.branch.outputs.db_url_with_pooler }}
        run: npm run db:migrate

      - name: Run Payload migrations
        env:
          DATABASE_URL: ${{ steps.branch.outputs.db_url_with_pooler }}
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
        run: npm run payload:migrate

      # Content is inherited from production. The August 2026 snapshot was
      # a one-time CMS migration fixture; importing it here overwrites newer
      # vocabulary (including audio) while leaving newer lessons in place.
      # Check the migrated production data without replacing CMS-authored rows.
      # The deterministic content check, and the reason it is worth a job slot:
      # it reads through Payload at the app's own depth and populate with no
      # cache in front of it. `parity` cannot replace it — `unstable_cache` has
      # answered parity from an entry built before the change twice, once
      # passing a whole pre-migration lesson. This one cannot lie.
      #
      # Fails on any unpopulated upload and any unresolved `termRef`. Missing
      # pronunciation audio is reported on its own line without failing, because
      # that is an editorial backlog rather than a regression.
      - name: Verify content structure
        env:
          DATABASE_URL: ${{ steps.branch.outputs.db_url_with_pooler }}
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
        run: npm run content:verify

      # Typecheck and tests live in `ci.yml`, which is not gated on Neon and so
      # runs even when this workflow skips. The build stays here because it
      # boots Payload and needs the database.
      - name: Build
        env:
          DATABASE_URL: ${{ steps.branch.outputs.db_url_with_pooler }}
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          BETTER_AUTH_URL: http://localhost:3000
        run: npm run build

  delete:
    if: vars.NEON_PROJECT_ID != '' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Delete the PR's Neon branch
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch: preview/pr-${{ github.event.pull_request.number }}
          api_key: ${{ secrets.NEON_API_KEY }}
