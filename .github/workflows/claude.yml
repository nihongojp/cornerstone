name: Claude Code

# Runs Claude when someone mentions @claude on a pull request — a PR
# conversation comment, an inline review comment, or a review body.
#
#   @claude              Opus reviews the PR. Comments only; edits and commits
#   @claude review ...   are denied. A bare mention counts as a review request.
#   @claude <anything>   Sonnet does what the comment asks — usually a change,
#                        committed and pushed to the PR branch. It sees the
#                        PR's earlier comments and reviews (including a previous
#                        `@claude review`), so "fix what the review found" works.
#
# The action itself refuses to run for anyone without write access to the
# repository, so on this public repo a drive-by commenter cannot trigger it.
# The job-level `if` below is only there so every other comment doesn't spin
# up a runner.
#
# Requires:
#   the Claude GitHub App installed on the repo (https://github.com/apps/claude)
#   secret CLAUDE_CODE_OAUTH_TOKEN   from `claude setup-token`

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

# One run per PR at a time. Queued rather than cancelled, so a second mention
# doesn't kill a run that may be halfway through pushing a commit.
concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    # `issue_comment` also fires for plain issues; `issue.pull_request` is only
    # set when the issue is a PR.
    if: |
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Read-only on purpose. Claude's comments and commits go through the Claude
    # GitHub App's short-lived token (fetched via `id-token`), not this job's
    # GITHUB_TOKEN. Pushes made with the App token do trigger CI, so Claude's
    # commits get checked like anyone else's.
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # lets Claude read CI results on the PR
    steps:
      # Review mode when the comment is only the mention ("@claude", "@claude?"),
      # or "@claude review ...". Everything else is a fix run.
      #
      # Fork PRs always get review mode. The App can't push to a fork, and a fix
      # run executes the PR's own code (`npm ci`, `npm test`) in a job holding
      # the OAuth token.
      - name: Pick mode
        id: route
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BODY: ${{ github.event.comment.body || github.event.review.body }}
          PR_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
        run: |
          fork=$(gh pr view "$PR_NUMBER" --json isCrossRepository --jq .isCrossRepository)
          body=$(printf '%s' "$BODY" | tr '\n' ' ' | tr '[:upper:]' '[:lower:]')
          rest=$(printf '%s' "$body" | sed 's/@claude//g' | tr -d '[:space:][:punct:]')
          if [ "$fork" = "true" ] || [ -z "$rest" ] || printf '%s' "$body" | grep -qE '@claude[[:space:]]+review([^[:alnum:]_-]|$)'; then
            mode=review
          else
            mode=fix
          fi
          echo "mode=$mode (fork=$fork)"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      # Fix mode only: Claude runs `npm ci` itself after the action has checked
      # out the PR branch, so the install matches the PR's lockfile.
      - name: Set up Node
        if: steps.route.outputs.mode == 'fix'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # No `prompt` on either step: Claude follows the instructions in the
      # comment that mentioned @claude.

      - name: Review with Claude Opus
        if: steps.route.outputs.mode == 'review'
        uses: anthropics/claude-code-action@bf38e86e58df9ebf3420326d019f955bb3be64dd # v1.0.225
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
          # Tag mode always grants file edits and git commit/push; the deny
          # list here wins over that.
          claude_args: |
            --model claude-opus-5
            --max-turns 60
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr list:*),Bash(gh pr comment:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh search:*)"
            --disallowedTools "Edit,MultiEdit,Write,NotebookEdit,Bash(git add:*),Bash(git commit:*),Bash(git rm:*)"
            --append-system-prompt "This run is review-only: you cannot edit files or commit. If the triggering comment is just the mention with no request, do a full review of the PR. Read AGENTS.md for the repo's conventions and review against them. Leave findings as inline comments where they point at a line, and summarise in your tracking comment. If the comment asks for changes, describe them precisely enough that a follow-up '@claude fix ...' can apply them."

      - name: Fix with Claude Sonnet
        if: steps.route.outputs.mode == 'fix'
        uses: anthropics/claude-code-action@bf38e86e58df9ebf3420326d019f955bb3be64dd # v1.0.225
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
          claude_args: |
            --model claude-sonnet-5
            --max-turns 100
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr list:*),Bash(gh pr comment:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh search:*),Bash(npm ci),Bash(npm test),Bash(npm run typecheck)"
            --append-system-prompt "Read AGENTS.md before changing code and follow it. Work from the triggering comment plus the PR's existing review comments, including any earlier Claude review. Before committing, run npm ci, then npm run typecheck and npm test; if they fail, fix the cause or say in your tracking comment why you are pushing anyway."
